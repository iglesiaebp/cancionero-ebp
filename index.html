<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cancionero</title>
<meta name="theme-color" content="#1a1d29">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg: #14161f;
    --bg-elevated: #1c1f2b;
    --bg-card: #20232f;
    --ink: #f2efe9;
    --ink-dim: #9a9caa;
    --line: #2d3140;
    --accent: #e8a23d;
    --accent-dim: #6b5530;
    --good: #5fb88a;
    --bad: #d96c5f;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;}
  #root{height:100%;display:flex;flex-direction:column;}

  /* ===== HEADER ===== */
  header{
    padding: 18px 20px 14px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .brand h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-style: italic;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.2px;
    display:flex;align-items:center;gap:10px;
  }
  .brand h1 svg{flex-shrink:0;}
  .sync-btn{
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 12px;
    font-family: var(--font-body);
    font-weight: 600;
    display:flex;align-items:center;gap:7px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .sync-btn:active{transform:scale(0.96);}
  .sync-btn.syncing svg{animation: spin 1s linear infinite;}
  .sync-btn.fresh{ color: var(--good); border-color: rgba(95,184,138,0.35); }
  .sync-btn.stale{ color: var(--accent); border-color: rgba(232,162,61,0.35); }
  @keyframes spin{ to{transform:rotate(360deg);} }

  .search-wrap{ position:relative; }
  .search-wrap svg.search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color: var(--ink-dim); pointer-events:none;
  }
  #search{
    width:100%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 14px 42px;
    font-size: 17px;
    color: var(--ink);
    font-family: var(--font-body);
    outline:none;
  }
  #search:focus{ border-color: var(--accent); }
  #search::placeholder{ color: var(--ink-dim); }
  .clear-btn{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--ink-dim); padding:6px; cursor:pointer; display:none;
  }
  .clear-btn.show{display:block;}

  /* ===== TABS ===== */
  .tabs{
    display:flex; gap:6px; margin-top:14px;
  }
  .tab-btn{
    flex:1;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-body);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
    position:relative;
  }
  .tab-btn.active{
    background: var(--bg-card);
    color: var(--ink);
    border-color: var(--accent-dim);
  }
  .tab-badge{
    background: var(--accent); color:#1a1308; font-size:10px; font-weight:800;
    min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* ===== STATUS BAR ===== */
  .status-line{
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 10px;
    display:flex; align-items:center; gap:6px;
    font-family: var(--font-mono);
    letter-spacing: 0.3px;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0;}
  .status-dot.offline{background:var(--ink-dim);}

  /* ===== LIST ===== */
  main{ flex:1; overflow-y:auto; padding: 10px 14px 100px; -webkit-overflow-scrolling:touch; }
  .song-item{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 16px;
    margin-bottom: 9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .song-item:active{ transform: scale(0.985); border-color: var(--accent-dim); }
  .song-name{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 500;
    line-height:1.3;
    flex:1;
    min-width:0;
  }
  .song-name mark{ background: transparent; color: var(--accent); font-weight:700; }
  .song-meta{
    font-size:11px; color:var(--ink-dim); margin-top:4px; font-family:var(--font-mono);
    display:flex; align-items:center; gap:5px;
  }

  .add-btn{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background: var(--bg-elevated); border:1px solid var(--line); color: var(--accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .add-btn.added{ background: var(--accent); color:#1a1308; border-color: var(--accent); }
  .add-btn:active{ transform: scale(0.92); }

  /* ===== SET LIST ===== */
  .set-item{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 10px 13px 14px;
    margin-bottom: 9px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .set-number{
    width:26px; height:26px; border-radius:8px; background:var(--bg-elevated);
    color: var(--accent); font-family:var(--font-mono); font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .set-item .song-name{ font-size:16px; cursor:pointer; }
  .set-actions{ display:flex; gap:4px; flex-shrink:0; }
  .set-actions button{
    width:32px; height:32px; border-radius:8px; background:transparent; border:none;
    color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .set-actions button:active{ background: var(--bg-elevated); }
  .set-actions button.danger:active{ color: var(--bad); }
  .set-actions button:disabled{ opacity:0.25; }

  .set-footer{
    position:fixed; bottom:0; left:0; right:0;
    padding: 14px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    display:flex; gap:10px;
  }
  .set-footer button{
    flex:1; padding:14px; border-radius:12px; font-weight:700; font-size:14px;
    border:1px solid var(--line); background: var(--bg-card); color: var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  .set-footer button.primary{ background: var(--accent); color:#1a1308; border:none; }
  .set-footer button:active{ transform: scale(0.97); }

  /* ===== PRESENTATION MODE ===== */
  #presentation{
    position:fixed; inset:0; background: var(--bg); z-index:60;
    display:none; flex-direction:column;
  }
  #presentation.open{ display:flex; }
  .pres-header{
    flex-shrink:0; padding: 10px 14px; background:var(--bg-elevated);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
  }
  .pres-counter{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);
    background: var(--bg-card); padding:5px 10px; border-radius:7px; flex-shrink:0;
  }
  .pres-title{
    font-family:var(--font-display); font-style:italic; font-weight:600; font-size:15px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
  }
  #pres-frame{ flex:1; border:none; width:100%; background:#fff; }
  .pres-nav{
    flex-shrink:0; display:flex; gap:1px; background: var(--line);
  }
  .pres-nav button{
    flex:1; padding:18px; background: var(--bg-elevated); border:none; color:var(--ink);
    font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .pres-nav button:disabled{ color: var(--ink-dim); opacity:0.35; }
  .pres-nav button:active:not(:disabled){ background: var(--bg-card); }

  .empty-state{
    text-align:center; padding: 60px 30px; color: var(--ink-dim);
  }
  .empty-state svg{ opacity:0.4; margin-bottom:16px; }
  .empty-state h3{ font-family:var(--font-display); font-style:italic; font-weight:500; color:var(--ink); font-size:19px; margin:0 0 8px; }
  .empty-state p{ font-size:14px; line-height:1.5; margin:0; }
  .empty-state button{
    margin-top:18px; background: var(--accent); color:#1a1308; border:none;
    padding:12px 22px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* ===== VIEWER ===== */
  #viewer{
    position:fixed; inset:0; background: var(--bg); z-index:50;
    display:none; flex-direction:column;
  }
  #viewer.open{ display:flex; }
  .viewer-header{
    flex-shrink:0; padding: 12px 14px; background:var(--bg-elevated);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
  }
  .back-btn{
    background:var(--bg-card); border:1px solid var(--line); color:var(--ink);
    width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center;
    flex-shrink:0; cursor:pointer;
  }
  .viewer-title{
    font-family:var(--font-display); font-style:italic; font-weight:600; font-size:15px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
  }
  #pdf-frame{ flex:1; border:none; width:100%; background:#fff; }

  /* ===== OFFLINE NOTICE ===== */
  .offline-notice{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; text-align:center; color:var(--ink-dim); gap:14px;
  }
  .offline-notice svg{ opacity:0.4; }
  .offline-notice h3{ font-family:var(--font-display); font-style:italic; color:var(--ink); margin:0; }
  .offline-notice p{ font-size:14px; line-height:1.5; margin:0; }

  /* ===== TOAST ===== */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px);
    background: var(--bg-elevated); border:1px solid var(--line);
    padding:13px 20px; border-radius:12px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:9px; z-index:100;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
    max-width: calc(100vw - 40px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }
  #toast.good{ border-color: rgba(95,184,138,0.4); }
  #toast.bad{ border-color: rgba(217,108,95,0.4); }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="root">

  <header>
    <div class="brand">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Cancionero
      </h1>
      <button class="sync-btn" id="syncBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        <span id="syncLabel">Sincronizar</span>
      </button>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Buscar alabanza..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="status-line">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Cargando...</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabBuscar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        Buscar
      </button>
      <button class="tab-btn" id="tabSet">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Mi set
        <span class="tab-badge" id="setBadge" style="display:none;">0</span>
      </button>
    </div>
  </header>

  <main id="list"></main>

</div>

<div id="presentation">
  <div class="pres-header">
    <button class="back-btn" id="presBackBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="pres-title" id="presTitle"></div>
    <div class="pres-counter" id="presCounter"></div>
  </div>
  <iframe id="pres-frame" allow="autoplay"></iframe>
  <div class="pres-nav">
    <button id="presPrev">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m15 18-6-6 6-6"/></svg>
      Anterior
    </button>
    <button id="presNext">
      Siguiente
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>

<div id="viewer">
  <div class="viewer-header">
    <button class="back-btn" id="backBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="viewer-title" id="viewerTitle"></div>
  </div>
  <div id="viewerBody" style="flex:1;display:flex;flex-direction:column;"></div>
</div>

<div id="toast"></div>

<script>
/* ===================== CONFIG ===================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8419svtBBsG6AWJ5wauJUF94yVfx0esQefZGD2OrQs-Nuxun0KAAp07KcjHNm7lHtEg/exec";
const DB_NAME = "cancionero-db";
const DB_VERSION = 1;
const STORE = "canciones";

/* ===================== INDEXEDDB ===================== */
// Guarda solo metadatos (sin blob): {id, nombre, fechaModificacion, urlPreview}
let db;
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = ()=>{ db = req.result; resolve(db); };
    req.onerror = ()=> reject(req.error);
  });
}
function dbGetAll(){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readonly");
    const store = tx.objectStore(STORE);
    const req = store.getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  });
}
function dbPut(item){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(item);
    tx.oncomplete = resolve;
    tx.onerror = ()=> reject(tx.error);
  });
}
function dbSetMeta(key, value){
  return dbPut({ id: "__meta_"+key, value });
}
async function dbGetMeta(key){
  const all = await dbGetAll();
  const found = all.find(x => x.id === "__meta_"+key);
  return found ? found.value : null;
}

/* ===================== STATE ===================== */
let songs = []; // {id, nombre, fechaModificacion, urlPreview}
let filtered = [];
let mySet = []; // array de ids en orden
let activeTab = "buscar";

/* ===================== SET PERSISTENCE ===================== */
async function loadSet(){
  const stored = await dbGetMeta("miSet");
  mySet = Array.isArray(stored) ? stored : [];
  updateSetBadge();
}
async function saveSet(){
  await dbSetMeta("miSet", mySet);
  updateSetBadge();
}
function updateSetBadge(){
  const badge = document.getElementById("setBadge");
  if(mySet.length > 0){
    badge.style.display = "flex";
    badge.textContent = mySet.length;
  } else {
    badge.style.display = "none";
  }
}
function toggleInSet(id){
  const idx = mySet.indexOf(id);
  if(idx === -1){
    mySet.push(id);
    toast("Agregada a tu set", "good");
  } else {
    mySet.splice(idx, 1);
  }
  saveSet();
  renderList();
  if(activeTab === "set") renderSetList();
}
function moveInSet(id, direction){
  const idx = mySet.indexOf(id);
  const newIdx = idx + direction;
  if(newIdx < 0 || newIdx >= mySet.length) return;
  [mySet[idx], mySet[newIdx]] = [mySet[newIdx], mySet[idx]];
  saveSet();
  renderSetList();
}
function removeFromSet(id){
  mySet = mySet.filter(x => x !== id);
  saveSet();
  renderSetList();
}
async function clearSet(){
  mySet = [];
  await saveSet();
  renderSetList();
  toast("Set vaciado", "good");
}

/* ===================== TOAST ===================== */
let toastTimer;
function toast(msg, type="good"){
  const el = document.getElementById("toast");
  el.className = "show " + type;
  el.innerHTML = (type==="good"
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
  ) + '<span>'+msg+'</span>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 3200);
}

/* ===================== RENDER LIST ===================== */
function highlightMatch(name, query){
  if(!query) return name;
  const idx = name.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return name;
  return name.slice(0,idx) + "<mark>" + name.slice(idx, idx+query.length) + "</mark>" + name.slice(idx+query.length);
}

function renderList(){
  const listEl = document.getElementById("list");
  const query = document.getElementById("search").value.trim();

  if(songs.length === 0){
    listEl.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <h3>Sin alabanzas todavía</h3>
        <p>Conéctate a internet y presiona<br>"Sincronizar" para descargar el repertorio.</p>
        <button onclick="syncSongs()">Sincronizar ahora</button>
      </div>`;
    return;
  }

  if(filtered.length === 0){
    listEl.innerHTML = `
      <div class="empty-state">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <h3>No se encontró "${query}"</h3>
        <p>Revisa la ortografía o prueba con<br>otra palabra del título.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = filtered.map(s => {
    const inSet = mySet.includes(s.id);
    return `
    <div class="song-item">
      <div style="min-width:0; flex:1;" onclick="openSong('${s.id}')">
        <div class="song-name">${highlightMatch(s.nombre, query)}</div>
        <div class="song-meta">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          PDF
        </div>
      </div>
      <button class="add-btn ${inSet ? 'added' : ''}" onclick="event.stopPropagation(); toggleInSet('${s.id}')" aria-label="${inSet ? 'Quitar del set' : 'Agregar al set'}">
        ${inSet
          ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>'
          : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>'
        }
      </button>
    </div>
  `}).join("");
}

function renderSetList(){
  const listEl = document.getElementById("list");

  if(mySet.length === 0){
    listEl.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <h3>Tu set está vacío</h3>
        <p>Ve a "Buscar" y presiona el botón [+]<br>en cada alabanza que vayan a tocar.</p>
      </div>`;
    return;
  }

  const items = mySet.map(id => songs.find(s => s.id === id)).filter(Boolean);

  listEl.innerHTML = items.map((s, i) => `
    <div class="set-item">
      <div class="set-number">${i+1}</div>
      <div style="flex:1; min-width:0;" onclick="openSong('${s.id}')">
        <div class="song-name">${s.nombre}</div>
      </div>
      <div class="set-actions">
        <button onclick="moveInSet('${s.id}', -1)" ${i===0 ? 'disabled' : ''} aria-label="Mover arriba">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m18 15-6-6-6 6"/></svg>
        </button>
        <button onclick="moveInSet('${s.id}', 1)" ${i===items.length-1 ? 'disabled' : ''} aria-label="Mover abajo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button class="danger" onclick="removeFromSet('${s.id}')" aria-label="Quitar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  `).join("") + `
    <div class="set-footer">
      <button onclick="clearSet()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        Vaciar set
      </button>
      <button class="primary" onclick="startPresentation()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M5 3 19 12 5 21Z"/></svg>
        Iniciar
      </button>
    </div>
  `;
}

function switchTab(tab){
  activeTab = tab;
  document.getElementById("tabBuscar").classList.toggle("active", tab === "buscar");
  document.getElementById("tabSet").classList.toggle("active", tab === "set");
  document.querySelector(".search-wrap").style.display = tab === "buscar" ? "block" : "none";
  if(tab === "buscar") renderList(); else renderSetList();
}
document.getElementById("tabBuscar").addEventListener("click", ()=> switchTab("buscar"));
document.getElementById("tabSet").addEventListener("click", ()=> switchTab("set"));
window.toggleInSet = toggleInSet;
window.moveInSet = moveInSet;
window.removeFromSet = removeFromSet;
window.clearSet = clearSet;

/* ===================== PRESENTATION MODE ===================== */
let presIndex = 0;
function startPresentation(){
  if(mySet.length === 0) return;
  presIndex = 0;
  document.getElementById("presentation").classList.add("open");
  history.pushState({ presentation: true }, "");
  showPresSong();
}
function showPresSong(){
  const items = mySet.map(id => songs.find(s => s.id === id)).filter(Boolean);
  const song = items[presIndex];
  if(!song) return;

  document.getElementById("presTitle").textContent = song.nombre;
  document.getElementById("presCounter").textContent = (presIndex+1) + " / " + items.length;
  document.getElementById("pres-frame").src = song.urlPreview;

  document.getElementById("presPrev").disabled = presIndex === 0;
  document.getElementById("presNext").disabled = presIndex === items.length - 1;
}
function closePresentation(){
  document.getElementById("presentation").classList.remove("open");
  document.getElementById("pres-frame").src = "";
}
document.getElementById("presPrev").addEventListener("click", ()=>{
  if(presIndex > 0){ presIndex--; showPresSong(); }
});
document.getElementById("presNext").addEventListener("click", ()=>{
  const items = mySet;
  if(presIndex < items.length - 1){ presIndex++; showPresSong(); }
});
document.getElementById("presBackBtn").addEventListener("click", ()=> history.back());
window.startPresentation = startPresentation;

function applyFilter(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  document.getElementById("clearBtn").classList.toggle("show", q.length > 0);
  filtered = q === "" ? songs : songs.filter(s => s.nombre.toLowerCase().includes(q));
  renderList();
}

/* ===================== SYNC ===================== */
// Sincronizar solo guarda metadatos (id, nombre, fecha, urlPreview)
// No descarga PDFs - se abren directo desde Google Drive
async function syncSongs(){
  const btn = document.getElementById("syncBtn");
  const label = document.getElementById("syncLabel");
  if(!navigator.onLine){
    toast("Sin conexión a internet. Conéctate para sincronizar.", "bad");
    return;
  }
  btn.classList.add("syncing");
  label.textContent = "Sincronizando...";

  try{
    const res = await fetch(SCRIPT_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const indice = await res.json();

    if(!Array.isArray(indice)) throw new Error("Respuesta inválida");

    let nuevos = 0, actualizados = 0;
    const existentes = await dbGetAll();
    const existentesMap = {};
    existentes.forEach(e => { if(!e.id.startsWith("__meta_")) existentesMap[e.id] = e; });

    for(const item of indice){
      const existente = existentesMap[item.id];
      const esNuevo = !existente;
      const cambio = existente && existente.fechaModificacion !== item.fechaModificacion;

      if(esNuevo || cambio){
        await dbPut({
          id: item.id,
          nombre: item.nombre,
          fechaModificacion: item.fechaModificacion,
          urlPreview: item.url  // URL de preview de Google Drive
        });
        esNuevo ? nuevos++ : actualizados++;
      }
    }

    await dbSetMeta("lastSync", new Date().toISOString());
    await dbSetMeta("totalRemoto", indice.length);

    await loadFromDB();

    if(nuevos === 0 && actualizados === 0){
      toast("Ya estás al día. " + songs.length + " alabanzas.", "good");
    } else {
      toast(`${nuevos} nuevas, ${actualizados} actualizadas`, "good");
    }
  }catch(err){
    console.error(err);
    toast("No se pudo sincronizar. Intenta de nuevo.", "bad");
  }finally{
    btn.classList.remove("syncing");
    updateSyncLabel();
  }
}

async function updateSyncLabel(){
  const btn = document.getElementById("syncBtn");
  const label = document.getElementById("syncLabel");
  const last = await dbGetMeta("lastSync");

  if(!last){
    label.textContent = "Sincronizar";
    btn.className = "sync-btn";
    return;
  }
  const date = new Date(last);
  const hoursSince = (Date.now() - date.getTime()) / 36e5;
  const formatted = date.toLocaleDateString('es', { day:'numeric', month:'short' }) + ', ' + date.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});

  if(hoursSince < 36){
    btn.className = "sync-btn fresh";
  } else {
    btn.className = "sync-btn stale";
  }
  label.textContent = "Actualizado " + formatted;
}

function updateStatusLine(){
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if(navigator.onLine){
    dot.classList.remove("offline");
    text.textContent = `${songs.length} alabanzas · en línea`;
  } else {
    dot.classList.add("offline");
    text.textContent = `${songs.length} alabanzas · sin conexión`;
  }
}

/* ===================== LOAD FROM DB ===================== */
async function loadFromDB(){
  const all = await dbGetAll();
  songs = all
    .filter(x => !x.id.startsWith("__meta_"))
    .map(x => ({ id: x.id, nombre: x.nombre, urlPreview: x.urlPreview, fechaModificacion: x.fechaModificacion }))
    .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
  if(activeTab === "buscar") applyFilter(); else renderSetList();
  updateStatusLine();
}

/* ===================== VIEWER ===================== */
function openSong(id){
  const song = songs.find(s => s.id === id);
  if(!song) return;

  document.getElementById("viewerTitle").textContent = song.nombre;
  const body = document.getElementById("viewerBody");

  if(navigator.onLine){
    body.innerHTML = `<iframe id="pdf-frame" src="${song.urlPreview}" style="flex:1;border:none;width:100%;background:#fff;height:100%;"></iframe>`;
  } else {
    body.innerHTML = `
      <div class="offline-notice">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        <h3>Sin conexión</h3>
        <p>Necesitas internet para ver los PDFs.<br>Conéctate y vuelve a intentarlo.</p>
      </div>`;
  }

  document.getElementById("viewer").classList.add("open");
  history.pushState({ viewer: true }, "");
}

function closeViewer(){
  document.getElementById("viewer").classList.remove("open");
  document.getElementById("viewerBody").innerHTML = "";
}
window.addEventListener("popstate", ()=>{
  if(document.getElementById("viewer").classList.contains("open")) closeViewer();
  if(document.getElementById("presentation").classList.contains("open")) closePresentation();
});
document.getElementById("backBtn").addEventListener("click", ()=> history.back());

/* ===================== EVENTS ===================== */
document.getElementById("search").addEventListener("input", applyFilter);
document.getElementById("clearBtn").addEventListener("click", ()=>{
  document.getElementById("search").value = "";
  applyFilter();
});
document.getElementById("syncBtn").addEventListener("click", syncSongs);
window.addEventListener("online", updateStatusLine);
window.addEventListener("offline", updateStatusLine);
window.openSong = openSong;
window.syncSongs = syncSongs;

/* ===================== INIT ===================== */
(async function init(){
  await openDB();
  await loadSet();
  await loadFromDB();
  await updateSyncLabel();

  if(songs.length === 0 && navigator.onLine){
    syncSongs();
  }
})();

/* ===================== SERVICE WORKER ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
